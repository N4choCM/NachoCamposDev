[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Ensure platform optional native deps (Tailwind oxide) are installed on Linux
  NPM_FLAGS = "--include=optional"

# SPA fallback lives in public/_redirects (copied to dist on build).
# Do NOT add a catch-all redirect here — it breaks netlify dev + Vite module loading.

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Avoid sticky favicon caches (especially Safari)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
